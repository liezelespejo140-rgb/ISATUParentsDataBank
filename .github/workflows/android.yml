name: Build and Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Add this step first to check out your repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Followed by your Java/Gradle setup
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Adjust to your project version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 3. Your build or test command
      - name: Run build
        run: ./gradlew build
